<!doctype html>
<html lang="%lang%" dir="%dir%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Status bar matches the active theme (design-system spec §3.6e). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E5F1E3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#304D4E" />
    <!-- iOS doesn't fully honor the manifest (§3.6d). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cheqii" />
    <link rel="apple-touch-icon" href="/logos/icon_512.png" />
    <script>
      if ("localStorage" in window) {
        let theme = localStorage.getItem("theme");
        const prefersDarkMode = window.matchMedia("(prefers-color-scheme: dark)");
        const updateTheme = (e) => {
          theme = e.matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          localStorage.setItem("theme", theme);
        };
        if (!theme) {
          updateTheme(prefersDarkMode);
        } else {
          document.documentElement.dataset.theme = theme;
        }
        prefersDarkMode.addEventListener("change", updateTheme);
      }
    </script>
    <link rel="icon" href="/logos/icon.svg" />
    <link rel="manifest" href="/app.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="display: contents">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
